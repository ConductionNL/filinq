# app-tests.yml — docudesk caller for the reusable feature-test workflow.
#
# Runs the PHASE-5 testing layers on every PR to the protected branches.
# l10n-check HARD-GATES; e2e/newman are scaffolded and opt-in (run-e2e /
# run-newman) until the NC service container is wired (see tests.yml TODOs).
# Additive — sits alongside the existing release/quality workflows.
#
# unit-gating: true — docudesk's tests/unit suite is green
# (`./vendor/bin/phpunit --configuration phpunit-unit.xml tests/unit` → 531 tests,
# 0 errors / 0 failures). The prior ~40-error / 12-failure drift was stale test
# constructor signatures + legacy config-key assertions that lagged the source;
# both were updated to the current contract, so the unit job now HARD-GATES the PR.

name: app-tests

on:
  pull_request:
    branches:
      - development
      - main
      - beta
  workflow_dispatch:
    inputs:
      run-e2e:
        type: boolean
        default: false
      run-newman:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.forgejo/workflows/tests.yml
    secrets: inherit
    with:
      app-id: docudesk
      unit-gating: true
      run-e2e: ${{ github.event.inputs.run-e2e == 'true' }}
      run-newman: ${{ github.event.inputs.run-newman == 'true' }}
