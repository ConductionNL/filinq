name: l10n

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, beta, development]

permissions:
  contents: read

jobs:
  l10n:
    name: l10n coverage (en.json)
    runs-on: ubuntu-latest
    # Observed fleet-wide across 225 executions: median 0.1 min, max 1.2 min
    # (filinq). No job in this workflow declared a timeout, so a hang ran to
    # GitHub's 6-hour default; 15 min is a wide margin over every real run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # check-l10n.js uses only Node built-ins (fs/path) — no npm ci needed.
      - name: Check l10n coverage
        run: npm run test:l10n
