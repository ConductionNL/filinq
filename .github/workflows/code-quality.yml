name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, beta, development]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Permission CEILING for the called quality pipeline. GitHub statically
# validates the called workflow's declared job permissions against this
# grant — even for jobs that are disabled — so it must cover the maximum
# any nested job declares: journeydoc-capture (contents+actions write),
# update-baseline / features-extract (contents write), and the Quality
# Report PR comment (issues / pull-requests write).
permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  quality:
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: docudesk
      php-version: "8.3"
      nextcloud-test-refs: '["stable32"]'
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      # `enable-frontend` only buys eslint + stylelint. The repo's own frontend
      # suites are opt-in through `frontend-checks`, which was never set — so
      # the 77-test Jest suite, the 45-test Vitest suite, the manifest schema
      # validation and the l10n key check had NEVER executed on a pull request.
      # Each entry becomes its own "Frontend Check (<script>)" job and must
      # exist in package.json and be self-contained.
      frontend-checks: '["test", "test:unit", "check:manifest", "test:l10n"]'
      enable-phpunit: true
      # OpenRegister is a hard dependency: DocuDesk stores every template,
      # signing request and consent record as an OpenRegister object, and
      # `tests/e2e/ci-seed.sh` provisions the registers through OpenRegister's
      # own admin importer. Tracking `development` rather than `beta` so CI
      # exercises the same OpenRegister the rest of the fleet integrates
      # against; `beta` lags and the importer contract this seed relies on
      # (`POST /api/configurations/import`) is read from `development`.
      additional-apps: '[{"repo":"ConductionNL/openregister","app":"openregister","ref":"development"}]'
      # Shared `E2E Tests (Playwright)` job.
      #
      # `playwright-test-path` does double duty: it is where the job looks for
      # spec files AND the first place it looks for a config. The workflow runs
      # `npx playwright test --config=<path>/playwright.config.ts` with NO
      # `--project`, so every project in whichever config it picks would run.
      # Pointing it at `tests/e2e` selects the CI-only config declared there,
      # which has just the regression project — the root `playwright.config.ts`
      # also declares `docs-capture` (owned by the Journeydoc job) and `visual`
      # (whose PNG baselines are host-font/GPU specific and cannot byte-match on
      # a CI Linux runner).
      enable-playwright: true
      playwright-test-path: tests/e2e
      # Provisions the OpenRegister registers/schemas and the app-config
      # object-type bindings DocuDesk needs, then gates on the frontend bundle
      # actually serving as JavaScript. Runs with cwd = Nextcloud server root.
      playwright-seed-command: 'bash apps/docudesk/tests/e2e/ci-seed.sh'

      # ── Integration tests ────────────────────────────────────────────────
      # `enable-newman` defaults to FALSE and this caller never set it, so
      # tests/integration/docudesk.postman_collection.json had never executed in
      # CI. It sits at the default `newman-collection-path` (tests/integration),
      # which is both the directory the validator counts collections in and the
      # directory the run step globs `*.postman_collection.json` in — flat, not
      # recursively.
      enable-newman: true

      # ── Coverage ratchet ─────────────────────────────────────────────────
      # `enable-coverage-guard` defaults to FALSE, which is why both
      # "Coverage Baseline Protection" and "Coverage Baseline Check" have only
      # ever reported `skipped`. It needs two inputs this repo did not have,
      # both added in this commit: `scripts/coverage-guard.php` (byte-identical
      # to openregister's) and `.coverage-baseline` = 52.88, this repo's own
      # measured coverage (5796 of 10961 statements) read from clover.xml in the
      # `coverage-report` artifact of run 30911556572.
      enable-coverage-guard: true

      # ── Hydra mechanical gates ───────────────────────────────────────────
      # `enable-hydra-gates` defaults to FALSE, so this tier has never executed
      # here — the job reported `skipped`, which the Quality Report renders
      # identically to a pass.
      # `enable-axe` deliberately NOT set: a vanilla Nextcloud 34 already carries
      # serious/critical violations on core's OWN routes that DOM scoping does
      # not remove. Enabling axe is a separate decision.
      enable-hydra-gates: true
      # No `hydra-gates-ref` here on purpose. The shared workflow defaults it
      # to @main, and this workflow is itself consumed at @main, so the two
      # sides move together and a gate fix reaches this repo without a commit
      # in this repo. A pin is a silent expiry date: 22 repos sat on v1.0.1 and
      # 16 gates were dead fleet-wide while every one reported PASS (.github#159),
      # and a default flipped at @main later reached those old runners and made
      # them red on gates they had no subject matter for (.github#173).
      # To hold this repo still for a specific reason, set the input explicitly
      # and say why — it is still honoured. To roll back for everyone, revert on
      # ConductionNL/.github main.
