# Filinq — OpenSpec Manifest
#
# Declares this app's tier, dependencies, and consumed shared specs for Hydra
# coordination. The `dependencies.openregister.minVersion` replaces the dropped
# `SettingsService::MIN_OPENREGISTER_VERSION = '0.2.10'` constant (see
# docudesk-adopt-or-abstractions, Task 1 + Decision 7).
#
# Validate with: openspec validate --manifest openspec/manifest.yaml

apiVersion: hydra/v1
kind: AppManifest

app:
  id: filinq
  tier: 2
  description: |
    Document-management app: OCR, anonymization, correspondence generation,
    digital signing, and template-driven document creation. Tier 2 — has its
    own service layer that legitimately wraps third-party libraries (Tesseract,
    ValidSign, NativeSigning), but delegates state-machine, archival, and
    notification machinery to OpenRegister.

dependencies:
  openregister:
    minVersion: "0.2.10"
    reason: >
      Core data layer (registers, schemas, objects, RBAC, audit trail, lifecycle,
      archival, calculations, notifications, background jobs, file attachments,
      TextExtractionService, FileService).

consumes:
  # OR-side shared specs that filinq adopts
  - id: register-resolver-service
    source: openregister
    reason: >
      Routes SettingsService IAppConfig reads that resolve register/schema
      references through OR's canonical resolver. Replaces direct
      IAppConfig::getValueString() calls for register slugs.

  - id: pluggable-integration-registry
    source: openregister
    reason: >
      Sidebar tabs (files, notes, tasks, audit, contacts) are registered through
      OR's integration registry (ADR-019) rather than maintained as custom
      implementations per sidebar surface.

  - id: i18n-source-of-truth
    source: openregister
    status: p2-gated
    reason: >
      Translatable fields on report/template/entity schemas (label, description,
      lifecycle-state-display-name, notification copy) adopt OR's i18n-source-of-truth
      once that spec ships. Until then, filinq maintains its own l10n strings.

  - id: i18n-api-language-negotiation
    source: openregister
    status: p2-gated
    reason: >
      The filinq public API will respect Accept-Language headers and return
      localised field values via OR's i18n-api-language-negotiation middleware
      once that spec ships.

  - id: multi-tenancy-context
    source: nextcloud-vue
    status: p2-gated
    reason: >
      Every filinq frontend store will read currentTenant from the
      useTenantContext() composable shipped by nc-vue. All hand-rolled tenant
      lookup is removed at that point.

# OR abstractions consumed per ADR-022
abstractions:
  - x-openregister-lifecycle:
      schemas:
        - signingRequest      # already annotated
        - signingSession      # added in docudesk-adopt-or-abstractions
        - batchCorrespondenceJob  # new schema, added in docudesk-adopt-or-abstractions
        - batchAnonymizationJob   # new schema, defined in apply phase
      replaces: >
        Inline 'status' => '...' writes in BatchCorrespondenceJob.php,
        NativeSigningProvider.php, ValidSignProvider.php, BatchStateService.php,
        FileEntityStatsService.php, BatchUploadService.php.

  - x-openregister-archival:
      schemas:
        - signingAuditEntry   # P10Y — Archiefwet cat. 5.1.3
        - signingRequest      # P10Y — Archiefwet cat. 5.1.3
        - signerRecord        # P10Y — Archiefwet cat. 5.1.3
        - correspondence      # P7Y  — Archiefwet cat. 3.2
        - batchCorrespondenceJob  # P1Y — Archiefwet cat. 1.2
      replaces: >
        The '// Archiefwet 1995 minimum 10-year retention' comment in
        SigningAuditService.php:7.

  - x-openregister-calculations:
      schemas:
        - fileAttachment (extension)  # anonymizationConfidence, riskScore, riskLevel, entityDensity, redactionCoverage
        - enrichedObject (extension)  # language, keywords, documentType, topicCategory
      replaces: >
        Ad-hoc writes in AnonymizationService, MetadataEnrichmentService event
        listener.

  - x-openregister-notifications:
      schemas:
        - batchCorrespondenceJob  # batchCompleted, batchFailed
        - signingRequest          # signingCompleted (already declared)
        - signerRecord            # signingRequested, signingDeadline (already declared)
      replaces: >
        Direct notificationManager->notify() calls in signing providers and
        BatchCorrespondenceJob.

# Admin-config keys replacing hardcoded constants (apply-phase only — not
# implemented in this spec-only change; listed here for Hydra coordination)
adminConfig:
  - key: filinq.ocr.default_languages
    default: "nld+eng"
    replaces: "OcrService::DEFAULT_LANGUAGES"

  - key: filinq.ocr.default_dpi
    default: 300
    replaces: "OcrService::DEFAULT_DPI"

  - key: filinq.templates.lock_timeout_minutes
    default: 15
    replaces: "TemplateService::LOCK_TIMEOUT_MINUTES"

  - key: filinq.batch.cache_ttl_seconds
    default: 7200
    replaces: "BatchStateService::CACHE_TTL"

  - key: filinq.batch.max_files_per_run
    default: 100
    replaces: "BatchStateService::DEFAULT_MAX_FILES"

  - key: filinq.correspondence.sync_batch_limit
    default: 10
    replaces: "CorrespondenceService::SYNC_BATCH_LIMIT"

  - key: filinq.correspondence.default_format
    default: "pdf"
    replaces: "CorrespondenceService::DEFAULT_FORMAT"

  - key: filinq.resolver.max_depth
    default: 3
    replaces: "DataResolverService::MAX_DEPTH"
