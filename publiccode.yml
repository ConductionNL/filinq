publiccodeYmlVersion: "0.4"

name: Filinq
url: "https://github.com/ConductionNL/filinq"
landingURL: "https://filinq.conduction.nl"
logo: img/app-store.svg
softwareVersion: "0.2.0"
releaseDate: "2026-09-06"
developmentStatus: stable
softwareType: "addon"

platforms:
  - web

categories:
  - document-management
  - e-signature
  - compliance-management

dependsOn:
  open:
    - name: Nextcloud
      versionMin: "32"
      versionMax: "35"
    - name: OpenRegister
      versionMin: "0.2.14"

intendedAudience:
  countries:
    - nl
  scope:
    - local-authorities
    - government

description:
  en:
    shortDescription: >
      GDPR publication consent management and document metadata enrichment for Nextcloud.
    longDescription: >
      Filinq provides GDPR-compliant publication consent tracking (Wet Open Overheid)
      and automatic document metadata enrichment. It integrates with Open Register via
      events to enrich documents as they are created and updated. Features include
      consent tracking with configurable objection periods, WOO compliance (minimum
      4-week objection period), automatic language detection, keyword extraction,
      topic classification, PDF generation, document signing (SES/AES/QES), and
      anonymization.
      Conduction maintains this component on behalf of the Municipality of Haarlem.
      Install it from the Nextcloud App Store at https://apps.nextcloud.com/apps/filinq.
    documentation: "https://filinq.conduction.nl"
    features:
      - GDPR publication consent tracking
      - Wet Open Overheid (WOO) compliance
      - Automatic document metadata enrichment
      - Language detection and keyword extraction
      - Document signing (SES / AES / QES)
      - Document anonymization
      - Local processing, no document data leaves your Nextcloud
      - Detection of names, addresses and BSN numbers before anonymization
      - Batch processing of multiple documents
      - PDF generation
    screenshots:
      - img/screenshot-dashboard.png
      - img/screenshot-consent.png
      - img/screenshot-anonymization.png

  nl:
    shortDescription: >
      AVG-publicatietoestemmingsbeheer en documentmetadata-verrijking voor Nextcloud.
    longDescription: >
      Filinq biedt AVG-conforme bijhouding van publicatietoestemmingen (Wet Open
      Overheid) en automatische verrijking van documentmetadata. Het integreert via
      events met Open Register om documenten te verrijken zodra ze worden aangemaakt
      of bijgewerkt. Functionaliteit omvat toestemmingsbeheer met instelbare
      bezwaarperiodes, WOO-compliance (minimaal 4 weken bezwaartermijn), automatische
      taaldetectie, trefwoordextractie, onderwerpclassificatie, PDF-generatie,
      documentondertekening (SES/AES/QES) en anonimisering.
      Conduction onderhoudt dit component in opdracht van Gemeente Haarlem.
      Installeer het vanuit de Nextcloud App Store op https://apps.nextcloud.com/apps/filinq.
    documentation: "https://filinq.conduction.nl"
    features:
      - AVG-publicatietoestemmingsbeheer
      - Wet Open Overheid (WOO)-compliance
      - Automatische verrijking van documentmetadata
      - Taaldetectie en trefwoordextractie
      - Documentondertekening (SES / AES / QES)
      - Documentanonimisering
      - Lokale verwerking, er verlaat geen documentdata je Nextcloud
      - Herkenning van namen, adressen en BSN-nummers voor anonimisering
      - Batchverwerking van meerdere documenten
      - PDF-generatie
    screenshots:
      - img/screenshot-dashboard.png
      - img/screenshot-consent.png
      - img/screenshot-anonymization.png

